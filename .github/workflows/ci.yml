name: ci

# Runs the full offline robustness gate on every push / PR to main.
# `make check` = plain tests -> valgrind -> ASan/UBSan -> TSan, plus the
# eval-ci retrieval-quality regression floor. It needs no embedder, no network,
# and no secrets (the toy hashed embedder + checked-in synthetic corpus stand
# in), so it runs unmodified in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcurl4-openssl-dev valgrind

      # Newer runner kernels default vm.mmap_rnd_bits=32, which the ASan
      # shadow-memory mapping can't satisfy and aborts at startup. 28 is the
      # value ASan expects. Best-effort; harmless where already compatible.
      - name: Work around ASan ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: make check (tests + valgrind + ASan/UBSan + TSan + eval-ci)
        run: make check

  # Portability check: the README claims Linux/macOS support, so prove the
  # macOS half. Plain `make test` only — valgrind isn't available on macOS
  # runners and the sanitizer layers are already exercised on Linux.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The runner's system curl ships no libcurl.pc; brew's does.
      - name: Install dependencies
        run: brew install pkg-config curl

      - name: make test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig"
          make test

  # The Python binding: build the wheel, install it into a fresh venv on a
  # machine with no build artefacts and no system libraries beyond a C
  # compiler (the wheel vendors SQLite and needs no curl), run its tests
  # without NumPy (optional dependency), then with it.
  python-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
      - name: Install into a clean venv and test (no NumPy)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/python/tests" -v
      - name: Test again with NumPy (zero-copy path)
        run: |
          /tmp/clean/bin/pip install numpy
          cd /tmp && /tmp/clean/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/python/tests" -v
